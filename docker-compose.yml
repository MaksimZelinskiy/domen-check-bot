version: '3.8'

services:
  pg_db:
    image: postgres:13-alpine
    container_name: domen_check_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    shm_size: 512mb  
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: |
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c max_connections=300  
        -c shared_buffers=1536MB 
        -c effective_cache_size=4GB
        -c work_mem=32MB
        -c maintenance_work_mem=256MB
        -c min_wal_size=2GB 
        -c max_wal_size=4GB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c idle_in_transaction_session_timeout=600000  
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6G

  tg_bot:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: domen_check_bot
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      pg_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - domen_check_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

networks:
  domen_check_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
